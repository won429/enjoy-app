<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="no-referrer">
    <title>KBO 경기 정보</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="baseball-game-detail.css">
</head>
<body class="app-bg" data-theme="all">
    <div id="detail-wrapper" class="app-bg">
        <section id="lineup-popup" class="app-bg">
            <div id="lineup-content" class="scrollbar-hide px-6 pt-main relative pb-4"></div>
        </section>
        <div id="detail-loader">
            <i class="fa-solid fa-baseball fa-spin text-3xl text-point"></i>
            <span>경기 정보를 불러오는 중...</span>
        </div>
    </div>
    <script src="baseball-game-players.js"></script>
    <script src="kbo_history_2026.js"></script>
    <script>
        (function () {
            const requestedDate = new URLSearchParams(window.location.search).get('matchDate') || '';
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const matchDate = /^\d{4}-\d{2}-\d{2}$/.test(requestedDate) ? requestedDate : today;
            window.__ENJOY_KBO_BASE_HISTORY = window.KBO_HISTORY_2026 || {};
            if (matchDate >= '2026-08-01') {
                document.write('<script src="kbo_history_2026_08.js"><\/script>');
            }
        })();
    </script>
    <script>
        (function () {
            const base = window.__ENJOY_KBO_BASE_HISTORY || {};
            const next = window.KBO_HISTORY_2026 || {};
            const merged = Object.assign({}, base, next);
            merged.from = base.from || next.from;
            merged.to = next.to || base.to;
            merged.gamesByDate = Object.assign({}, base.gamesByDate || {}, next.gamesByDate || {});
            merged.rankings = Array.isArray(next.rankings) && next.rankings.length ? next.rankings : (base.rankings || []);
            window.KBO_HISTORY_2026 = merged;
            window.getKboHistoryGames = function (dateStr) {
                return (merged.gamesByDate && merged.gamesByDate[dateStr]) || [];
            };
            window.getKboScheduleGames = window.getKboHistoryGames;
            window.getKboHistoryRankings = function () {
                return merged.rankings || [];
            };
            delete window.__ENJOY_KBO_BASE_HISTORY;
        })();
    </script>
    <script src="baseball-game-detail.js"></script>
</body>
</html>
