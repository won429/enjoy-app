<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="no-referrer">
    <title>KBO 경기 정보</title>

</head>
<body class="app-bg" data-theme="all">

        <section id="lineup-popup" class="app-bg">
            <div id="lineup-content" class="scrollbar-hide px-6 pt-main relative pb-4"></div>
        </section>
        <div id="detail-loader" class="is-skeleton" role="status" aria-busy="true">
            <span class="baseball-detail-skeleton-label">경기 정보를 불러오는 중</span>
            <div class="baseball-detail-skeleton" aria-hidden="true">
                <span class="bds-block bds-heading"></span>
                <div class="bds-match"><div class="bds-teams"><div class="bds-team"><span class="bds-block bds-logo"></span><span class="bds-block bds-name"></span></div><span class="bds-block bds-score"></span><div class="bds-team"><span class="bds-block bds-logo"></span><span class="bds-block bds-name"></span></div></div><span class="bds-block bds-inning"></span><span class="bds-block bds-inning"></span><span class="bds-block bds-inning"></span></div>
                <span class="bds-block bds-probability"></span>
                <div class="bds-comparison"><span class="bds-block bds-record"></span><span class="bds-block bds-record"></span></div>
                <div class="bds-tabs"><span class="bds-block bds-tab"></span><span class="bds-block bds-tab"></span><span class="bds-block bds-tab"></span></div>
                <div class="bds-lineups"><div><div class="bds-player"><span class="bds-block bds-photo"></span><span class="bds-block bds-player-name"></span></div><div class="bds-player"><span class="bds-block bds-photo"></span><span class="bds-block bds-player-name"></span></div><div class="bds-player"><span class="bds-block bds-photo"></span><span class="bds-block bds-player-name"></span></div><div class="bds-player"><span class="bds-block bds-photo"></span><span class="bds-block bds-player-name"></span></div><div class="bds-player"><span class="bds-block bds-photo"></span><span class="bds-block bds-player-name"></span></div></div><div><div class="bds-player"><span class="bds-block bds-photo"></span><span class="bds-block bds-player-name"></span></div><div class="bds-player"><span class="bds-block bds-photo"></span><span class="bds-block bds-player-name"></span></div><div class="bds-player"><span class="bds-block bds-photo"></span><span class="bds-block bds-player-name"></span></div><div class="bds-player"><span class="bds-block bds-photo"></span><span class="bds-block bds-player-name"></span></div><div class="bds-player"><span class="bds-block bds-photo"></span><span class="bds-block bds-player-name"></span></div></div></div>
            </div>
        </div>
    </div>
    <script src="baseball-game-players.js"></script>
    <script src="kbo_history_2026.js"></script>
    <script>
        (function () {
            const requestedDate = new URLSearchParams(window.location.search).get('matchDate') || '';
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const matchDate = /^\d{4}-\d{2}-\d{2}$/.test(requestedDate) ? requestedDate : today;
            window.__ENJOY_KBO_MATCH_DATE = matchDate;
            window.__ENJOY_KBO_HISTORY_PARTS = [window.KBO_HISTORY_2026 || {}];
            if (matchDate >= '2026-08-01') {
                document.write('<script src="kbo_history_2026_08.js"><\/script>');
            }
        })();
    </script>
    <script>
        (function () {
            if (window.__ENJOY_KBO_MATCH_DATE >= '2026-08-01') {
                window.__ENJOY_KBO_HISTORY_PARTS.push(window.KBO_HISTORY_2026 || {});
            }
            if (window.__ENJOY_KBO_MATCH_DATE >= '2026-09-01') {
                document.write('<script src="kbo_history_2026_09.js"><\/script>');
            }
        })();
    </script>
    <script>
        (function () {
            if (window.__ENJOY_KBO_MATCH_DATE >= '2026-09-01') {
                window.__ENJOY_KBO_HISTORY_PARTS.push(window.KBO_HISTORY_2026 || {});
            }
            if (window.__ENJOY_KBO_MATCH_DATE >= '2026-10-01') {
                document.write('<script src="kbo_history_2026_10.js"><\/script>');
            }
        })();
    </script>
    <script>
        (function () {
            if (window.__ENJOY_KBO_MATCH_DATE >= '2026-10-01') {
                window.__ENJOY_KBO_HISTORY_PARTS.push(window.KBO_HISTORY_2026 || {});
            }
            const merged = (window.__ENJOY_KBO_HISTORY_PARTS || []).reduce(function (history, next) {
                const combined = Object.assign({}, history, next);
                combined.from = history.from || next.from;
                combined.to = next.to || history.to;
                combined.gamesByDate = Object.assign({}, history.gamesByDate || {}, next.gamesByDate || {});
                combined.rankings = Array.isArray(next.rankings) && next.rankings.length ? next.rankings : (history.rankings || []);
                return combined;
            }, {});
            window.KBO_HISTORY_2026 = merged;
            window.getKboHistoryGames = function (dateStr) {
                return (merged.gamesByDate && merged.gamesByDate[dateStr]) || [];
            };
            window.getKboScheduleGames = window.getKboHistoryGames;
            window.getKboHistoryRankings = function () {
                return merged.rankings || [];
            };
            delete window.__ENJOY_KBO_MATCH_DATE;
            delete window.__ENJOY_KBO_HISTORY_PARTS;
        })();
    </script>
    <script src="baseball-game-detail.js?v=20261024-skeleton1"></script>
</body>
</html>
