<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>아시안게임 야구 · 엔조이</title>
<meta name="description" content="대한민국과 아시아 국가대표팀의 야구 일정, 경기 결과를 확인하세요.">
<link rel="stylesheet" href="asian-games.css">
<script defer src="baseball-competition.js"></script>
<script defer src="asian-games.js"></script>
</head>
<body>
<header class="topbar"><button id="back" class="icon-button" aria-label="야구 커뮤니티로 돌아가기">‹</button><span>ENJOY <b>BASEBALL</b></span><span class="edition">2026</span></header>
<main>
<section class="hero" aria-labelledby="hero-title">
    <p class="eyebrow">ASIAN GAMES · BASEBALL</p>
    <h1 id="hero-title">아시아의 무대,<br><em>대한민국의 야구.</em></h1>
    <p class="hero-copy">하나의 열정, 더 큰 아시아.<br>우리의 다음 경기를 함께 응원해요.</p>
    <img class="hero-banner" src="baseball-assets/asian-games-banner.png" width="2000" height="360" alt="아시안게임 야구 경기를 응원하세요">
    <a href="#schedule" class="hero-link">경기 일정 살펴보기 <span aria-hidden="true">↓</span></a>
</section>
<section class="next-section" aria-labelledby="next-title">
    <div class="section-heading"><h2 id="next-title">대한민국의 다음 경기</h2><span class="live-tag">TEAM KOREA</span></div>
    <div id="next-game" aria-live="polite"><p class="state-message">경기 일정을 확인하고 있어요.</p></div>
</section>
<section id="schedule" class="schedule" aria-labelledby="schedule-title">
    <div class="section-heading"><div><p class="eyebrow">MATCH CENTER</p><h2 id="schedule-title">경기 일정</h2></div><button id="refresh" class="text-button">새로고침 ↻</button></div>
    <div id="country-tabs" class="country-tabs" role="group" aria-label="국가별 일정 선택"></div>
    <div class="month-nav"><button id="prev-month" class="icon-button" aria-label="이전 달">‹</button><h3 id="month-label"></h3><button id="next-month" class="icon-button" aria-label="다음 달">›</button></div>
    <div id="date-rail" class="date-rail" role="group" aria-label="경기 날짜 선택"></div>
    <div class="day-heading"><h3 id="day-label"></h3><span id="game-count"></span></div>
    <p id="load-status" role="status"></p>
    <div id="game-list" aria-live="polite"></div>
    <p class="time-note">모든 경기 시간은 한국 시간 기준입니다.</p>
</section>
<footer>하나의 열정으로, 끝까지 함께. <b>ENJOY</b></footer>
</main>
<dialog id="detail-dialog"><button id="close-detail" class="icon-button" aria-label="경기정보 닫기">‹</button><iframe id="detail-frame" title="아시안게임 경기정보"></iframe></dialog>
</body>
</html>
