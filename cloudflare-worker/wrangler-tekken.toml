name = "enjoy-tekken"
main = "tekken-worker.js"
compatibility_date = "2026-08-19"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "enjoy-meeting-account"
ALLOWED_ORIGINS = "https://enjoy-app.pages.dev,https://won429.github.io,http://localhost:8765,http://127.0.0.1:8765"

[[durable_objects.bindings]]
name = "TEKKEN_ROOMS"
class_name = "TekkenRoom"

[[migrations]]
tag = "tekken-v1"
new_sqlite_classes = ["TekkenRoom"]

[[ratelimits]]
name = "TEKKEN_CONNECT_LIMITER"
namespace_id = "429008"
[ratelimits.simple]
limit = 30
period = 60
