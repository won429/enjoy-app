<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>로그인 · 엔조이</title>
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root { color-scheme: dark; font-family: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif; background: #000; color: #fff; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; }
        main { display: flex; flex-direction: column; width: min(100%, 28rem); min-height: 100dvh; margin: 0 auto; padding: max(1.5rem, env(safe-area-inset-top)) 1.75rem max(2rem, env(safe-area-inset-bottom)); }
        .back { align-self: flex-start; padding: .5rem 0; color: #b0b8c1; font-size: .875rem; font-weight: 600; text-decoration: none; }
        .intro { margin-top: 3rem; text-align: center; }
        .greeting { margin: 0 0 1.5rem; color: #3182f6; font-size: 1.3125rem; font-weight: 800; }
        h1 { margin: 0; font-size: 1.75rem; line-height: 1.32; font-weight: 800; letter-spacing: -.02em; }
        .subtitle { margin: .875rem 0 0; color: #ffffff80; font-size: .90625rem; line-height: 1.6; }
        .google-button { display: flex; align-items: center; justify-content: center; gap: .75rem; width: 100%; margin-top: 2.25rem; padding: .9375rem .75rem; border: 0; border-radius: 999px; background: #fff; color: #141414; font: inherit; font-size: .9375rem; font-weight: 700; cursor: pointer; transition: transform .15s; }
        .google-button:active { transform: scale(.97); }
        .google-button:disabled { opacity: .55; cursor: wait; }
        .google-button svg { width: 1.25rem; height: 1.25rem; flex: none; }
        .status { min-height: 2.5rem; margin: .875rem 0 0; color: #b0b8c1; text-align: center; font-size: .8125rem; line-height: 1.6; }
        .browse { display: block; margin: .5rem auto 0; padding: .75rem; color: #b0b8c1; text-align: center; font-size: .875rem; font-weight: 600; text-underline-offset: .2rem; }
        .info { margin: 2rem 0; padding: 1.5rem; border-radius: 1.375rem; background: #1c1c1e; }
        .info h2 { margin: 0; font-size: 1.125rem; line-height: 1.4; }
        .info p { margin: .5625rem 0 0; color: #ffffff8c; font-size: .875rem; line-height: 1.62; }
        footer { margin-top: auto; padding-top: 2rem; color: #ffffff61; text-align: center; font-size: .8125rem; line-height: 1.8; }
        footer a { color: inherit; text-underline-offset: .2rem; }
        a:focus-visible, button:focus-visible { outline: 2px solid #3182f6; outline-offset: 4px; }
        @media (prefers-color-scheme: light) {
            :root { color-scheme: light; background: #f2f2f7; color: #1d1d1f; }
            .subtitle, .status, .browse, .back { color: #6e6e73; }
            .google-button { box-shadow: 0 .25rem 1rem #0000000d; }
            .info { background: #fff; }
            .info p { color: #6e6e73; }
            footer { color: #8b95a1; }
        }
    </style>
    <script src="login.js?v=20261025-1" defer></script>
</head>
<body>
    <main>
        <a class="back" href="index.html">← 홈으로</a>
        <header class="intro">
            <p class="greeting">반가워요</p>
            <h1>엔조이 계정으로<br>로그인하세요</h1>
            <p class="subtitle">회원 계정에 연결된 기록과<br>엔조이의 멤버 기능을 이용해보세요.</p>
        </header>
        <button id="login-google-btn" class="google-button" type="button" disabled>
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
            Google 계정으로 로그인
        </button>
        <p id="login-status" class="status" role="status" aria-live="polite">로그인을 준비하고 있어요.</p>
        <a class="browse" href="index.html">로그인 없이 둘러보기</a>
        <noscript><p class="status">로그인하려면 자바스크립트를 켜주세요. 공개 콘텐츠는 홈에서 볼 수 있어요.</p></noscript>
        <section class="info">
            <h2>필요할 때 로그인하세요</h2>
            <p>홈과 공개 콘텐츠는 로그인 없이 둘러볼 수 있어요. 계정이 필요한 기능을 이용할 때 로그인해주세요.</p>
        </section>
        <footer>Copyright © 2026 엔조이. All rights reserved.<br><a href="privacy.html">개인정보처리방침</a></footer>
    </main>
</body>
</html>
