<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#152d28">
    <meta name="robots" content="noindex,nofollow">
    <title>드롭 마을</title>
    <link rel="stylesheet" href="village.css?v=20261102-2">
</head>
<body>
    <main id="village-root" hidden>
        <canvas id="village-canvas" tabindex="0" aria-label="마을 산책. 방향키 또는 WASD로 걷기, Shift로 달리기, E로 살펴보기."></canvas>
        <button id="village-leave" aria-label="드롭 게임으로 돌아가기" type="button">←</button>
        <div id="village-rotate" hidden role="status"><div class="rotate-device" aria-hidden="true"></div><p>기기를 가로로 돌려주세요</p><small>가로 화면에서 플레이할 수 있어요.</small></div>
        <div id="village-controls">
            <div id="village-stick" role="group" aria-label="이동 조이스틱"><div id="village-stick-knob"></div><button data-dir="up" aria-label="앞으로 걷기" type="button"></button><button data-dir="left" aria-label="왼쪽 걷기" type="button"></button><button data-dir="right" aria-label="오른쪽 걷기" type="button"></button><button data-dir="down" aria-label="뒤로 걷기" type="button"></button></div>
            <div class="village-actions"><button id="village-run" type="button" aria-label="달리기" aria-pressed="false"><b>B</b></button><button id="village-interact" type="button" aria-label="살펴보기" disabled><b>A</b><span id="village-action-label"></span></button></div>
        </div>
        <canvas id="village-map" width="240" height="240" aria-label="아파트 배치와 현재 위치" hidden></canvas>
        <section id="village-dialog" hidden aria-labelledby="village-dialog-title" role="dialog" aria-modal="true"><h2 id="village-dialog-title"></h2><p id="village-dialog-text"></p><button id="village-dialog-close" type="button" aria-label="계속 산책하기">계속 산책하기 <span>A</span></button></section>
    </main>
    <div id="village-status" role="status"><p>마을을 준비하고 있어요.</p><a href="index.html">돌아가기</a></div>
    <script src="village-world.js?v=20261102-2"></script>
    <script type="module" src="village.js?v=20261102-2"></script>
</body>
</html>
