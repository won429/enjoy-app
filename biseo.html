<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>엔조이 비서실장</title>
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 기기 폭에 따라 화면 전체가 같은 비율로 커지고 작아진다.
           기준 375px. 375보다 넓어도 더 커지지는 않고, 좁은 폰에서만 0.9배까지 줄어든다.
           OS 글꼴 크기 설정은 따르지 않는다(레이아웃이 기기마다 달라지지 않도록). */
        html {
            font-size: clamp(14.4px, 4.2667vw, 16px);
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        :root {
            color-scheme: dark light;
            --visual-height: 100dvh;
            --visual-top: 0;
            --page: #000000;
            --surface: rgba(255, 255, 255, 0.055);
            --surface-strong: rgba(255, 255, 255, 0.09);
            --border: rgba(255, 255, 255, 0.11);
            --text: #ffffff;
            --muted: #a1a1a6;
            --assistant: rgba(255, 255, 255, 0.075);
            --assistant-tail: rgba(255, 255, 255, 0.075);
            --user: #3182f6;
            --user-text: #ffffff;
            --blue: #3182f6;
            --composer: rgba(22, 22, 24, 0.9);
            --header: rgba(0, 0, 0, 0.88);
            --separator: var(--border);
            --send-disabled: rgba(255, 255, 255, 0.14);
            --sheet: rgba(26, 26, 28, 0.94);
            --shadow: 0 1.125rem 3.25rem rgba(0, 0, 0, 0.36), 0 0.375rem 1rem rgba(0, 0, 0, 0.24);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --page: #f2f4f6;
                --surface: rgba(255, 255, 255, 0.86);
                --surface-strong: rgba(255, 255, 255, 0.96);
                --border: rgba(0, 0, 0, 0.07);
                --text: #141414;
                --muted: #6b7684;
                --assistant: rgba(255, 255, 255, 0.96);
                --assistant-tail: rgba(255, 255, 255, 0.96);
                --composer: rgba(255, 255, 255, 0.94);
                --header: rgba(242, 244, 246, 0.9);
                --send-disabled: rgba(0, 0, 0, 0.08);
                --sheet: rgba(248, 248, 250, 0.96);
                --shadow: 0 0.875rem 2.25rem rgba(0, 0, 0, 0.11), 0 0.1875rem 0.625rem rgba(0, 0, 0, 0.08);
            }
        }

        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--page);
        }
        body {
            position: fixed;
            inset: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
        button, textarea { font: inherit; }
        button { border: 0; cursor: pointer; }

        .enjoy-page {
            position: fixed;
            top: var(--visual-top);
            left: 50%;
            width: 100%;
            max-width: 28rem;
            height: var(--visual-height);
            transform: translateX(-50%);
            overflow: hidden;
            background: var(--page);
            color: var(--text);
            box-shadow: 0 0 2.25rem rgba(0, 0, 0, 0.08);
        }
        .chat-shell {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--page);
        }

        .chat-header {
            position: relative;
            z-index: 20;
            flex: none;
            padding: max(0.8125rem, env(safe-area-inset-top)) 0.875rem 0.6875rem;
            background: var(--header);
            border-bottom: 0.0625rem solid var(--separator);
            -webkit-backdrop-filter: blur(1.125rem) saturate(1.5);
            backdrop-filter: blur(1.125rem) saturate(1.5);
        }
        .chat-header-main {
            display: grid;
            grid-template-columns: 2.625rem minmax(0, 1fr) 5.25rem;
            align-items: center;
            gap: 0.5rem;
        }
        .header-side {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .header-side.right { justify-content: flex-end; }
        .header-button {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 62.4375rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            color: var(--text);
            border: 0.0625rem solid var(--border);
            transition: transform .14s ease, background-color .14s ease;
        }
        .header-button:active {
            transform: scale(.94);
            background: var(--surface-strong);
        }
        .header-profile {
            position: relative;
            min-width: 0;
            display: grid;
            grid-template-columns: 2.375rem minmax(0, 1fr);
            column-gap: 0.625rem;
            align-items: center;
            text-align: left;
        }
        .assistant-avatar {
            position: relative;
            grid-row: span 2;
            width: 2.375rem;
            height: 2.375rem;
            border-radius: 62.4375rem;
            display: grid;
            place-items: center;
            overflow: visible;
            background: linear-gradient(160deg, #dcecff, #9fc7ff);
            box-shadow: 0 0.25rem 0.75rem rgba(0, 122, 255, 0.2);
        }
        .assistant-avatar img {
            width: 2.25rem;
            height: 2.25rem;
            object-fit: contain;
            object-position: center bottom;
            transform: translateY(0.1875rem) scale(1.12);
        }
        .online-dot {
            position: absolute;
            right: -0.1875rem;
            bottom: 0.0625rem;
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 50%;
            background: #34c759;
            border: 0.125rem solid var(--page);
            z-index: 2;
            box-shadow: 0 0 0 0.0625rem rgba(52, 199, 89, 0.08);
        }
        .online-dot.thinking { background: #ff9f0a; }
        .assistant-name {
            width: 100%;
            min-width: 0;
            color: var(--text);
            font-size: 1.0625rem;
            line-height: 1.3125rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .profile-status {
            color: var(--muted);
            font-size: 0.71875rem;
            line-height: 0.9375rem;
            font-weight: 750;
        }
        .thread-title-bar {
            min-height: 1.125rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0.4375rem 0.25rem 0 3.25rem;
            color: var(--muted);
            font-size: 0.6875rem;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .messages {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 1rem 0.875rem 0.625rem;
            background: var(--page);
            scroll-behavior: smooth;
        }
        .keyboard-adjusting .messages { scroll-behavior: auto; }
        .messages::-webkit-scrollbar { display: none; }
        .day-divider {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            justify-content: center;
            margin: 0.25rem 0 1.125rem;
            color: var(--muted);
            font-size: 0.6875rem;
            font-weight: 850;
        }
        .day-divider::before,
        .day-divider::after {
            content: "";
            height: 0.0625rem;
            background: var(--border);
            flex: 1;
        }
        .day-divider span {
            padding: 0 0.125rem;
            border-radius: 62.4375rem;
            background: transparent;
        }
        .message-row {
            position: relative;
            display: flex;
            align-items: flex-end;
            margin: 0.125rem 0;
            animation: messageIn .2s ease both;
        }
        .message-row.group-start { margin-top: 0.5625rem; }
        .message-row.user { justify-content: flex-end; padding-left: 3.375rem; }
        .message-row.assistant { justify-content: flex-start; padding-right: 3.375rem; }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(0.3125rem) scale(.985); }
            to { opacity: 1; transform: none; }
        }
        .message-avatar {
            position: relative;
            z-index: 2;
            width: 1.875rem;
            height: 1.875rem;
            margin-right: 0.625rem;
            border-radius: 50%;
            overflow: visible;
            flex: none;
            background: #3182f6;
            visibility: hidden;
            box-shadow: 0 0 0 0.0625rem rgba(255, 255, 255, 0.16);
        }
        .message-row.group-end .message-avatar { visibility: visible; }
        .message-avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            display: block;
            transform: none;
        }
        .bubble {
            position: relative;
            max-width: min(100%, 20rem);
            padding: 0.5rem 0.75rem 0.5625rem;
            border-radius: 1.125rem;
            font-size: 0.9375rem;
            line-height: 1.42;
            font-weight: 520;
            letter-spacing: -0.012em;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: keep-all;
        }
        .assistant .bubble {
            background: var(--assistant);
            border: 0.0625rem solid var(--border);
            color: var(--text);
            box-shadow: 0 0.4375rem 1.375rem rgba(0, 0, 0, 0.11);
        }
        .user .bubble {
            background: var(--user);
            color: var(--user-text);
            box-shadow: 0 0.5625rem 1.5rem rgba(49, 130, 246, 0.28);
        }
        .assistant:not(.group-start) .bubble { border-top-left-radius: 0.4375rem; }
        .assistant:not(.group-end) .bubble { border-bottom-left-radius: 0.4375rem; }
        .user:not(.group-start) .bubble { border-top-right-radius: 0.4375rem; }
        .user:not(.group-end) .bubble { border-bottom-right-radius: 0.4375rem; }
        .message-row.group-end.user .bubble::before,
        .message-row.group-end.assistant .bubble::before,
        .message-row.group-end.user .bubble::after,
        .message-row.group-end.assistant .bubble::after {
            content: "";
            position: absolute;
            bottom: 0;
            height: 1.125rem;
        }
        .message-row.group-end.user .bubble::before {
            right: -0.4375rem;
            width: 0.9375rem;
            background: var(--user);
            border-bottom-left-radius: 0.9375rem 0.8125rem;
        }
        .message-row.group-end.user .bubble::after {
            right: -0.6875rem;
            width: 0.6875rem;
            background: var(--page);
            border-bottom-left-radius: 0.6875rem;
        }
        .message-row.group-end.assistant .bubble::before {
            left: -0.4375rem;
            width: 0.9375rem;
            background: var(--assistant-tail);
            border-bottom-right-radius: 0.9375rem 0.8125rem;
        }
        .message-row.group-end.assistant .bubble::after {
            left: -0.6875rem;
            width: 0.6875rem;
            background: var(--page);
            border-bottom-right-radius: 0.6875rem;
        }
        .source-trigger {
            width: 100%;
            margin-top: 0.6875rem;
            padding-top: 0.5625rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.625rem;
            border-top: 0.0625rem solid var(--border);
            color: var(--blue);
            font-size: 0.75rem;
            line-height: 1.125rem;
            font-weight: 800;
            text-align: left;
            white-space: normal;
        }
        .source-trigger-copy {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
        }
        .source-trigger i { font-size: 0.6875rem; }

        .quick-prompts {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.5rem;
            margin: 0.25rem 0 1.125rem 2rem;
        }
        .quick-chip {
            min-height: 2.625rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6875rem 0.75rem;
            border-radius: 0.875rem;
            border: 0.0625rem solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 0.78125rem;
            font-weight: 800;
            text-align: left;
            box-shadow: 0 0.375rem 1.125rem rgba(0, 0, 0, 0.10);
            transition: transform .14s ease, background-color .14s ease;
        }
        .quick-chip i { color: var(--blue); }
        .quick-chip:active { transform: scale(.96); background: var(--surface-strong); }

        .typing {
            height: 0.9375rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0 0.125rem;
        }
        .typing span {
            width: 0.375rem;
            height: 0.375rem;
            border-radius: 50%;
            background: var(--muted);
            animation: typing 1s ease-in-out infinite;
        }
        .typing span:nth-child(2) { animation-delay: .14s; }
        .typing span:nth-child(3) { animation-delay: .28s; }
        @keyframes typing {
            0%, 70%, 100% { transform: translateY(0); opacity: .42; }
            35% { transform: translateY(-0.1875rem); opacity: 1; }
        }

        .composer-wrap {
            position: relative;
            z-index: 30;
            flex: none;
            padding: 0.875rem 0.75rem max(0.75rem, env(safe-area-inset-bottom));
            background: linear-gradient(to top, var(--page) 82%, transparent);
        }
        .composer {
            min-height: 2.75rem;
            display: flex;
            align-items: center;
            gap: 0.5625rem;
            padding: 0.3125rem 0.3125rem 0.3125rem 1.125rem;
            border: 0.0625rem solid #c7c7cc;
            border-color: var(--border);
            border-radius: 1.5rem;
            background: var(--composer);
            box-shadow: var(--shadow);
            -webkit-backdrop-filter: blur(1.25rem) saturate(1.5);
            backdrop-filter: blur(1.25rem) saturate(1.5);
            transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
        }
        .composer:focus-within {
            border-color: rgba(49, 130, 246, 0.24);
            box-shadow: var(--shadow);
        }
        .chat-input {
            display: block;
            flex: 1 1 auto;
            width: 100%;
            height: 1.75rem;
            min-height: 1.75rem;
            max-height: 7rem;
            margin: 0;
            padding: 0.1875rem 0;
            resize: none;
            overflow-y: hidden;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font-size: 0.96875rem;
            line-height: 1.375rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            -webkit-appearance: none;
            appearance: none;
            caret-color: var(--blue);
            transform: translateY(0);
        }
        .chat-input::placeholder {
            color: var(--muted);
            opacity: 1;
        }
        .send-button {
            width: 2.125rem;
            height: 2.125rem;
            flex: 0 0 2.125rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: center;
            background: var(--user);
            color: #ffffff;
            font-size: 0.875rem;
            transition: transform .13s ease, background-color .13s ease;
        }
        .send-button:active { transform: scale(.9); }
        .send-button:disabled {
            background: var(--send-disabled);
            color: var(--muted);
            transform: none;
        }

        .thread-drawer,
        .source-drawer {
            position: absolute;
            inset: 0;
            z-index: 80;
            display: flex;
            align-items: flex-end;
            pointer-events: none;
            visibility: hidden;
        }
        .thread-drawer.open,
        .source-drawer.open {
            pointer-events: auto;
            visibility: visible;
        }
        .thread-backdrop,
        .source-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: opacity .24s ease;
        }
        .thread-drawer.open .thread-backdrop,
        .source-drawer.open .source-backdrop { opacity: 1; }
        .thread-sheet,
        .source-sheet {
            position: relative;
            width: 100%;
            max-height: min(76%, 38.75rem);
            display: flex;
            flex-direction: column;
            padding: 0.5rem 0.75rem max(0.875rem, env(safe-area-inset-bottom));
            border-radius: 1.5rem 1.5rem 0 0;
            background: var(--sheet);
            box-shadow: 0 -0.75rem 2.5rem rgba(0, 0, 0, 0.16);
            transform: translateY(104%);
            transition: transform .34s cubic-bezier(.2, .85, .2, 1);
            -webkit-backdrop-filter: blur(1.75rem) saturate(1.6);
            backdrop-filter: blur(1.75rem) saturate(1.6);
        }
        .thread-drawer.open .thread-sheet,
        .source-drawer.open .source-sheet { transform: translateY(0); }
        .sheet-grabber {
            width: 2.375rem;
            height: 0.3125rem;
            margin: 0 auto 0.5rem;
            border-radius: 62.4375rem;
            background: #c7c7cc;
        }
        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.25rem 0.25rem 0.6875rem;
        }
        .sheet-title {
            margin: 0;
            font-size: 1.375rem;
            line-height: 1.15;
            font-weight: 850;
            letter-spacing: -0.03em;
        }
        .sheet-account {
            margin-top: 0.1875rem;
            color: var(--muted);
            font-size: 0.6875rem;
            font-weight: 600;
        }
        .new-thread-button {
            min-height: 2.375rem;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0 0.8125rem;
            border-radius: 1.1875rem;
            background: var(--blue);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 750;
        }
        .thread-list {
            min-height: 0;
            overflow-y: auto;
            padding: 0.125rem 0;
            scrollbar-width: none;
        }
        .thread-list::-webkit-scrollbar { display: none; }
        .thread-item {
            width: 100%;
            display: grid;
            grid-template-columns: 2.5rem minmax(0, 1fr) auto;
            gap: 0.625rem;
            align-items: center;
            padding: 0.625rem 0.5625rem;
            border-radius: 1rem;
            background: transparent;
            color: var(--text);
            text-align: left;
        }
        .thread-item + .thread-item { margin-top: 0.125rem; }
        .thread-item.active { background: rgba(49, 130, 246, .16); }
        .thread-item:active { background: rgba(120, 120, 128, .13); }
        .thread-avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            overflow: hidden;
            background: #dcecff;
        }
        .thread-avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: translateY(0.1875rem) scale(1.14);
        }
        .thread-copy { min-width: 0; }
        .thread-name {
            font-size: 0.875rem;
            line-height: 1.125rem;
            font-weight: 750;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .thread-preview {
            margin-top: 0.125rem;
            color: var(--muted);
            font-size: 0.71875rem;
            line-height: 0.9375rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .thread-time {
            align-self: start;
            padding-top: 0.1875rem;
            color: var(--muted);
            font-size: 0.625rem;
            font-weight: 600;
        }
        .local-note {
            padding: 0.625rem 0.5rem 0.125rem;
            color: var(--muted);
            font-size: 0.625rem;
            line-height: 1.4;
            text-align: center;
        }
        .source-sheet { max-height: min(70%, 32rem); }
        .source-list {
            min-height: 0;
            overflow-y: auto;
            padding: 0.125rem 0 0.25rem;
            scrollbar-width: none;
        }
        .source-list::-webkit-scrollbar { display: none; }
        .source-item {
            display: grid;
            grid-template-columns: 2.375rem minmax(0, 1fr) auto;
            align-items: center;
            gap: 0.6875rem;
            min-height: 3.625rem;
            padding: 0.5625rem;
            border-radius: 1rem;
            color: var(--text);
            text-decoration: none;
        }
        .source-item + .source-item { margin-top: 0.125rem; }
        .source-item:active { background: rgba(120, 120, 128, .13); }
        .source-icon {
            width: 2.375rem;
            height: 2.375rem;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(49, 130, 246, .14);
            color: var(--blue);
            font-size: 0.8125rem;
        }
        .source-copy { min-width: 0; }
        .source-name {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.875rem;
            line-height: 1.125rem;
            font-weight: 800;
        }
        .source-action {
            display: block;
            margin-top: 0.125rem;
            color: var(--muted);
            font-size: 0.6875rem;
            line-height: 0.9375rem;
            font-weight: 650;
        }
        .source-open-icon {
            padding-right: 0.25rem;
            color: var(--muted);
            font-size: 0.6875rem;
        }

        @media (max-width: 360px) {
            .chat-header-main { grid-template-columns: 2.375rem minmax(0, 1fr) 4.75rem; }
            .header-button { width: 2.0625rem; height: 2.0625rem; }
            .assistant-avatar { width: 2.25rem; height: 2.25rem; }
            .message-row.user { padding-left: 2.625rem; }
            .message-row.assistant { padding-right: 2.625rem; }
            .bubble { font-size: 0.90625rem; }
            .quick-prompts { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
    <link rel="stylesheet" href="tailwind.css">
</head>
<body>
    <div class="enjoy-page" id="enjoy-page">
        <section class="chat-shell" aria-label="엔조이 비서실장 채팅">
            <header class="chat-header">
                <div class="chat-header-main">
                    <div class="header-side">
                        <button type="button" class="header-button" id="back-button" aria-label="메인으로 돌아가기">
                            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                        </button>
                    </div>

                    <div class="header-profile">
                        <div class="assistant-avatar" aria-hidden="true">
                            <img src="dhkfodshf.png" alt="">
                            <span id="status-dot" class="online-dot"></span>
                        </div>
                        <div class="assistant-name">엔조이 비서실장 1</div>
                        <div id="status-text" class="profile-status">온라인</div>
                    </div>

                    <div class="header-side right">
                        <button type="button" class="header-button" id="thread-list-button" aria-label="저장된 대화 목록">
                            <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="header-button" id="new-chat-button" aria-label="새 대화">
                            <i class="fa-regular fa-pen-to-square" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div id="active-thread-title" class="thread-title-bar">새로운 대화</div>
            </header>

            <main id="messages" class="messages" aria-live="polite"></main>

            <form id="chat-form" class="composer-wrap">
                <div class="composer">
                    <textarea id="chat-input" class="chat-input" rows="1" placeholder="메시지 보내기" aria-label="메시지 입력"></textarea>
                    <button id="send-button" class="send-button" type="submit" aria-label="보내기" disabled>
                        <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
                    </button>
                </div>
            </form>
        </section>

        <div id="thread-drawer" class="thread-drawer" aria-hidden="true">
            <button type="button" class="thread-backdrop" id="thread-backdrop" aria-label="대화 목록 닫기"></button>
            <section class="thread-sheet" role="dialog" aria-modal="true" aria-labelledby="thread-sheet-title">
                <div class="sheet-grabber" aria-hidden="true"></div>
                <div class="sheet-header">
                    <div>
                        <h2 id="thread-sheet-title" class="sheet-title">대화</h2>
                        <div id="sheet-account" class="sheet-account"></div>
                    </div>
                    <button type="button" class="new-thread-button" id="sheet-new-chat-button">
                        <i class="fa-solid fa-plus" aria-hidden="true"></i>
                        새 대화
                    </button>
                </div>
                <div id="thread-list" class="thread-list"></div>
                <div class="local-note">대화는 현재 기기의 이 계정 저장공간에만 보관됩니다.</div>
            </section>
        </div>

        <div id="source-drawer" class="source-drawer" aria-hidden="true">
            <button type="button" class="source-backdrop" id="source-backdrop" aria-label="출처 닫기"></button>
            <section class="source-sheet" role="dialog" aria-modal="true" aria-labelledby="source-sheet-title">
                <div class="sheet-grabber" aria-hidden="true"></div>
                <div class="sheet-header">
                    <div>
                        <h2 id="source-sheet-title" class="sheet-title">출처</h2>
                        <div id="source-sheet-count" class="sheet-account"></div>
                    </div>
                </div>
                <div id="source-list" class="source-list"></div>
            </section>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        window.haptic = function () {
            if (navigator.vibrate) navigator.vibrate(10);
        };

        function returnToEnjoyHome() {
            if (window.parent !== window) {
                const targetOrigin = window.location.origin === 'null' ? '*' : window.location.origin;
                window.parent.postMessage({ type: 'enjoy:navigate-home' }, targetOrigin);
                return;
            }
            window.location.href = 'index.html';
        }

        const ACCOUNT_KEY = 'enjoy_chat_account_v1';
        const ACCOUNT_LABEL_KEY = 'enjoy_chat_account_label_v1';
        const LEGACY_KEY = 'enjoy-secretary-chat-v1';
        const THREAD_KEY_PREFIX = 'enjoy-secretary-threads-v2:';
        const MAX_THREADS = 40;
        const MAX_MESSAGES = 120;
        const BISEO_AI_API = 'https://enjoy-biseo-ai.sungwon4867.workers.dev';
        const AI_HISTORY_LIMIT = 20;
        const AI_TIMEOUT_MS = 30000;

        const pageEl = document.getElementById('enjoy-page');
        const messagesEl = document.getElementById('messages');
        const formEl = document.getElementById('chat-form');
        const inputEl = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const activeTitleEl = document.getElementById('active-thread-title');
        const drawerEl = document.getElementById('thread-drawer');
        const threadListEl = document.getElementById('thread-list');
        const sheetAccountEl = document.getElementById('sheet-account');
        const sourceDrawerEl = document.getElementById('source-drawer');
        const sourceListEl = document.getElementById('source-list');
        const sourceSheetCountEl = document.getElementById('source-sheet-count');

        const accountId = readAccountId();
        const accountLabel = readAccountLabel();
        const storageKey = THREAD_KEY_PREFIX + accountId;

        const starterMessages = [
            {
                role: 'assistant',
                text: '안녕하세요. 엔조이 비서실장입니다. 무엇을 도와드릴까요?',
                at: Date.now()
            }
        ];

        const quickPrompts = [
            { icon: 'fa-calendar-check', text: '오늘 일정 정리해줘' },
            { icon: 'fa-coins', text: '모임비 안내문 써줘' },
            { icon: 'fa-bell', text: '학교 공지 메모해줘' },
            { icon: 'fa-map-location-dot', text: '여행 계획 같이 짜줘' }
        ];

        let store = loadStore();
        let pendingReplies = new Set();
        let wasNearBottom = true;
        let viewportSettleTimer = null;

        function readAccountId() {
            try {
                const value = localStorage.getItem(ACCOUNT_KEY) || 'guest';
                return String(value).replace(/[^a-zA-Z0-9_-]/g, '_').slice(0, 160) || 'guest';
            } catch (error) {
                return 'guest';
            }
        }

        function readAccountLabel() {
            try {
                return localStorage.getItem(ACCOUNT_LABEL_KEY) || (accountId === 'guest' ? '게스트' : '엔조이 계정');
            } catch (error) {
                return accountId === 'guest' ? '게스트' : '엔조이 계정';
            }
        }

        function makeId() {
            if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
            return 'chat-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
        }

        function makeThread() {
            const now = Date.now();
            return {
                id: makeId(),
                title: '새로운 대화',
                createdAt: now,
                updatedAt: now,
                messages: starterMessages.map(function (message) {
                    return { role: message.role, text: message.text, at: now };
                })
            };
        }

        function normalizeMessage(message) {
            if (!message || typeof message.text !== 'string') return null;
            let text = message.text.slice(0, 12000);
            let sources = normalizeSources(message.sources);
            if (!sources.length) {
                const legacy = extractLegacySources(text);
                text = legacy.text;
                sources = legacy.sources;
            }
            return {
                role: message.role === 'user' ? 'user' : 'assistant',
                text: text,
                sources: sources,
                at: Number(message.at) || Date.now()
            };
        }

        function normalizeSources(rawSources) {
            if (!Array.isArray(rawSources)) return [];
            const seen = Object.create(null);
            return rawSources.reduce(function (result, source) {
                if (!source || result.length >= 5) return result;
                const url = String(source.url || '').trim();
                if (!/^https:\/\//i.test(url)) return result;
                const title = String(source.title || '웹 검색 결과').replace(/\s+/g, ' ').trim().slice(0, 120) || '웹 검색 결과';
                const key = title.toLowerCase();
                if (seen[key]) return result;
                seen[key] = true;
                result.push({ title: title, url: url.slice(0, 4000) });
                return result;
            }, []);
        }

        function extractLegacySources(text) {
            const marker = '\n\n출처\n';
            const markerIndex = text.lastIndexOf(marker);
            if (markerIndex < 0) return { text: text, sources: [] };
            const sources = text.slice(markerIndex + marker.length).split('\n').map(function (line) {
                const match = line.match(/^-\s+(.+?):\s+(https:\/\/\S+)$/);
                return match ? { title: match[1], url: match[2] } : null;
            }).filter(Boolean);
            const normalized = normalizeSources(sources);
            return normalized.length
                ? { text: text.slice(0, markerIndex).trim(), sources: normalized }
                : { text: text, sources: [] };
        }

        function normalizeThread(thread) {
            if (!thread || !Array.isArray(thread.messages)) return null;
            const messages = thread.messages.map(normalizeMessage).filter(Boolean).slice(-MAX_MESSAGES);
            if (!messages.length) return null;
            if (messages.length === 1 && messages[0].role === 'assistant') {
                messages[0].text = starterMessages[0].text;
            }
            return {
                id: String(thread.id || makeId()),
                title: String(thread.title || '새로운 대화').slice(0, 60),
                createdAt: Number(thread.createdAt) || Date.now(),
                updatedAt: Number(thread.updatedAt) || Date.now(),
                messages: messages
            };
        }

        function loadStore() {
            try {
                const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
                if (saved && Array.isArray(saved.threads)) {
                    const threads = saved.threads.map(normalizeThread).filter(Boolean).slice(0, MAX_THREADS);
                    if (threads.length) {
                        const activeExists = threads.some(function (thread) { return thread.id === saved.activeId; });
                        return { activeId: activeExists ? saved.activeId : threads[0].id, threads: threads };
                    }
                }
            } catch (error) {}

            if (accountId === 'guest') {
                try {
                    const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null');
                    if (Array.isArray(legacy) && legacy.length) {
                        const migrated = makeThread();
                        migrated.title = '이전 대화';
                        migrated.messages = legacy.map(normalizeMessage).filter(Boolean).slice(-MAX_MESSAGES);
                        if (!migrated.messages.length) migrated.messages = starterMessages.slice();
                        return { activeId: migrated.id, threads: [migrated] };
                    }
                } catch (error) {}
            }

            const first = makeThread();
            return { activeId: first.id, threads: [first] };
        }

        function saveStore() {
            store.threads = store.threads
                .sort(function (a, b) { return b.updatedAt - a.updatedAt; })
                .slice(0, MAX_THREADS);
            try {
                localStorage.setItem(storageKey, JSON.stringify(store));
            } catch (error) {
                store.threads.forEach(function (thread) {
                    thread.messages = thread.messages.slice(-60);
                });
                try { localStorage.setItem(storageKey, JSON.stringify(store)); } catch (ignored) {}
            }
        }

        function activeThread() {
            let thread = store.threads.find(function (item) { return item.id === store.activeId; });
            if (!thread) {
                thread = makeThread();
                store.threads.unshift(thread);
                store.activeId = thread.id;
            }
            return thread;
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function (character) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
            });
        }

        function renderChat(instant) {
            const thread = activeThread();
            const messages = thread.messages;
            let html = renderDayDivider();

            messages.forEach(function (message, index) {
                const previous = messages[index - 1];
                const next = messages[index + 1];
                html += renderMessage(
                    message,
                    !previous || previous.role !== message.role,
                    !next || next.role !== message.role,
                    index
                );
            });

            if (pendingReplies.has(thread.id)) html += renderTyping();
            messagesEl.innerHTML = html;
            activeTitleEl.textContent = thread.title;
            resizeInput();
            scrollToBottom(instant !== false);
        }

        function renderDayDivider() {
            const now = new Date();
            const label = now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
            return '<div class="day-divider"><span>' + escapeHtml(label) + '</span></div>';
        }

        function renderMessage(message, isStart, isEnd, messageIndex) {
            const role = message.role === 'user' ? 'user' : 'assistant';
            const classes = ['message-row', role];
            if (isStart) classes.push('group-start');
            if (isEnd) classes.push('group-end');
            const avatar = role === 'assistant'
                ? '<div class="message-avatar" aria-hidden="true"><img src="dhkfodshf.png" alt=""></div>'
                : '';
            const sources = role === 'assistant' ? normalizeSources(message.sources) : [];
            const sourceButton = sources.length
                ? '<button type="button" class="source-trigger" data-source-index="' + messageIndex + '">' +
                    '<span class="source-trigger-copy"><i class="fa-solid fa-link" aria-hidden="true"></i>출처 ' + sources.length + '개 보기</span>' +
                    '<i class="fa-solid fa-chevron-up" aria-hidden="true"></i>' +
                '</button>'
                : '';
            return '<div class="' + classes.join(' ') + '">' +
                avatar +
                '<div class="bubble">' + escapeHtml(message.text) + sourceButton + '</div>' +
            '</div>';
        }

        function renderTyping() {
            return '<div class="message-row assistant group-start group-end" id="typing-row">' +
                '<div class="message-avatar" aria-hidden="true"><img src="dhkfodshf.png" alt=""></div>' +
                '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>' +
            '</div>';
        }

        function renderQuickPrompts() {
            return '<div class="quick-prompts">' + quickPrompts.map(function (prompt, index) {
                return '<button type="button" class="quick-chip" data-prompt-index="' + index + '">' +
                    '<i class="fa-solid ' + prompt.icon + '" aria-hidden="true"></i>' +
                    '<span>' + escapeHtml(prompt.text) + '</span>' +
                '</button>';
            }).join('') + '</div>';
        }

        function scrollToBottom(instant) {
            requestAnimationFrame(function () {
                if (instant === false && typeof messagesEl.scrollTo === 'function') {
                    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
                } else {
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                }
            });
        }

        function nearBottom() {
            return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 90;
        }

        function resizeInput() {
            // scrollHeight 는 실제 px 이라 rem 을 못 쓴다. 화면 배율을 직접 곱해 준다.
            const s = (parseFloat(getComputedStyle(document.documentElement).fontSize) || 16) / 16;
            const minH = 28 * s, maxH = 112 * s;
            inputEl.style.height = minH + 'px';
            const nextHeight = Math.max(minH, Math.min(inputEl.scrollHeight, maxH));
            inputEl.style.height = nextHeight + 'px';
            inputEl.style.overflowY = inputEl.scrollHeight > maxH ? 'auto' : 'hidden';
            sendButton.disabled = !inputEl.value.trim() || pendingReplies.has(activeThread().id);
        }

        function makeTitle(text) {
            const clean = text.replace(/\s+/g, ' ').trim();
            if (!clean) return '새로운 대화';
            return clean.length > 24 ? clean.slice(0, 24) + '…' : clean;
        }

        function sendQuickPrompt(text) {
            inputEl.value = text;
            resizeInput();
            submitMessage();
        }

        function submitMessage() {
            const text = inputEl.value.trim();
            const thread = activeThread();
            if (!text || pendingReplies.has(thread.id)) return;

            window.haptic();
            const now = Date.now();
            thread.messages.push({ role: 'user', text: text, at: now });
            thread.messages = thread.messages.slice(-MAX_MESSAGES);
            if (thread.title === '새로운 대화') thread.title = makeTitle(text);
            thread.updatedAt = now;

            inputEl.value = '';
            pendingReplies.add(thread.id);
            setAssistantThinking(true);
            saveStore();
            renderChat();
            renderThreadList();

            const threadId = thread.id;
            requestAiReply(thread).then(function (reply) {
                const target = store.threads.find(function (item) { return item.id === threadId; });
                if (!target) return;
                target.messages.push({ role: 'assistant', text: reply.text, sources: reply.sources, at: Date.now() });
                target.messages = target.messages.slice(-MAX_MESSAGES);
                target.updatedAt = Date.now();
                pendingReplies.delete(threadId);
                saveStore();

                if (store.activeId === threadId) {
                    setAssistantThinking(false);
                    renderChat();
                }
                renderThreadList();
            }).catch(function () {
                const target = store.threads.find(function (item) { return item.id === threadId; });
                if (!target) return;
                target.messages.push({ role: 'assistant', text: '지금은 비서실장이 출장 중이에요. 잠시 후 다시 방문해 주세요.', at: Date.now() });
                target.messages = target.messages.slice(-MAX_MESSAGES);
                target.updatedAt = Date.now();
                pendingReplies.delete(threadId);
                saveStore();

                if (store.activeId === threadId) {
                    setAssistantThinking(false);
                    renderChat();
                }
                renderThreadList();
            });
        }

        async function requestAiReply(thread) {
            const controller = new AbortController();
            const timeoutId = window.setTimeout(function () { controller.abort(); }, AI_TIMEOUT_MS);
            const messages = thread.messages.slice(-AI_HISTORY_LIMIT).map(function (message) {
                return {
                    role: message.role === 'user' ? 'user' : 'assistant',
                    text: String(message.text || '').slice(0, 4000)
                };
            });

            try {
                const response = await fetch(BISEO_AI_API + '/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messages }),
                    signal: controller.signal
                });
                const data = await response.json().catch(function () { return {}; });
                if (!response.ok || typeof data.reply !== 'string' || !data.reply.trim()) {
                    throw new Error('AI response unavailable');
                }
                const legacy = extractLegacySources(data.reply.trim().slice(0, 12000));
                const structuredSources = normalizeSources(data.sources);
                return {
                    text: structuredSources.length ? data.reply.trim().slice(0, 12000) : legacy.text,
                    sources: structuredSources.length ? structuredSources : legacy.sources
                };
            } finally {
                window.clearTimeout(timeoutId);
            }
        }

        function createReply(text, thread) {
            const lower = normalizeForMatch(text);
            const nameInMessage = extractIntroducedName(text);
            const rememberedName = findRememberedName(thread);
            const topic = inferTopic(lower, thread);
            const directTopic = inferTopic(lower);
            const now = new Date();

            if (nameInMessage) {
                return nameInMessage + '님, 반가워요. 이 대화에서는 이름을 기억하고 있을게요. 무엇을 도와드릴까요?';
            }
            if (hasAny(lower, ['내 이름 기억', '내 이름 뭐', '내가 누구'])) {
                return rememberedName
                    ? '물론이죠. ' + rememberedName + '님이잖아요.'
                    : '아직 이름을 듣지 못했어요. “내 이름은 민지야”처럼 알려주시면 이 대화에서 기억할게요.';
            }
            if (hasAny(lower, ['너 이름', '넌 누구', '누구세요', '정체가 뭐'])) {
                return '저는 엔조이 비서실장이에요. 가벼운 대화도 하고, 일정이나 공지처럼 복잡한 내용을 보기 좋게 정리해드려요.';
            }
            if (hasAny(lower, ['뭘 할 수', '뭐 할 수', '도와줄 수', '사용법', '도움말'])) {
                return '간단한 대화는 물론이고 이런 일을 잘해요.\n\n• 일정과 할 일 정리\n• 모임비·공지 안내문 작성\n• 학교 공지 핵심 메모\n• 여행 계획의 기본 틀 만들기\n\n하고 싶은 일을 평소 말하듯 보내주세요.';
            }
            if (hasAny(lower, ['몇 시', '현재 시간', '지금 시간'])) {
                return '지금은 ' + now.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' }) + '이에요.';
            }
            if (hasAny(lower, ['오늘 날짜', '며칠이야', '무슨 요일', '날짜 알려'])) {
                return '오늘은 ' + now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' }) + '이에요.';
            }
            if (hasAny(lower, ['날씨', '비 와', '눈 와', '기온'])) {
                return '실시간 날씨는 아직 확인할 수 없어요. 지역과 예상 기온을 알려주시면 옷차림이나 준비물은 같이 골라드릴게요.';
            }
            if (hasAny(lower, ['힘들어', '지쳤어', '속상해', '우울해', '짜증나', '피곤해'])) {
                return (rememberedName ? rememberedName + '님, ' : '') + '오늘 마음이 꽤 무거웠나 봐요. 지금은 해결책보다 그냥 들어주는 게 좋을까요, 아니면 할 일을 하나씩 정리해볼까요?';
            }
            if (hasAny(lower, ['심심해', '재미없어', '할 거 없어'])) {
                return '그럼 가볍게 하나 골라볼까요? 오늘 있었던 일 이야기하기, 10분짜리 할 일 정하기, 주말 계획 세우기 중에서 마음 가는 걸 말해주세요.';
            }
            if (hasAny(lower, ['잘 지내', '뭐 해', '뭐하고', '어떻게 지내'])) {
                return '저는 여기서 기다리며 잘 지내고 있어요. ' + (rememberedName ? rememberedName + '님은 ' : '오늘은 ') + '어떤 하루를 보내고 있어요?';
            }
            if (hasAny(lower, ['안녕', '하이', 'ㅎㅇ', '반가'])) {
                return greetingForHour(now) + (rememberedName ? ', ' + rememberedName + '님.' : '.') + '\n오늘은 어떤 걸 같이 해볼까요?';
            }
            if (hasAny(lower, ['고마', '감사', '땡큐'])) {
                return '별말씀을요' + (rememberedName ? ', ' + rememberedName + '님' : '') + '. 또 필요한 게 생기면 편하게 말씀해주세요.';
            }
            if (hasAny(lower, ['미안', '죄송'])) {
                return '괜찮아요. 저한테는 편하게 말씀하셔도 돼요.';
            }
            if (hasAny(lower, ['잘 자', '굿나잇', '다음에 봐', '또 봐', '바이'])) {
                return '네, 푹 쉬세요' + (rememberedName ? ', ' + rememberedName + '님' : '') + '. 다음에 이어서 이야기해요.';
            }

            if (topic === 'schedule') return replyAboutSchedule(text, directTopic === 'schedule');
            if (topic === 'fee') return replyAboutFee(text, directTopic === 'fee');
            if (topic === 'school') return replyAboutSchool(text, directTopic === 'school');
            if (topic === 'travel') return replyAboutTravel(text, directTopic === 'travel');

            if (/^(응|어|네|예|그래|좋아|알겠어|ㅇㅇ)[.!?~ ]*$/.test(lower)) {
                return '좋아요. 이어서 필요한 내용을 편하게 보내주세요.';
            }
            if (/^(아니|아니야|싫어|됐어)[.!?~ ]*$/.test(lower)) {
                return '알겠어요. 그럼 다른 방식으로 도와드릴게요. 원하는 방향을 한마디로 알려주세요.';
            }

            return fallbackReply(text, rememberedName);
        }

        function normalizeForMatch(value) {
            return String(value || '').toLowerCase().replace(/\s+/g, ' ').trim();
        }

        function extractIntroducedName(text) {
            const match = String(text).trim().match(/^(?:안녕[,! ]*)?(?:내 이름은|제 이름은)\s*([가-힣a-zA-Z]{2,12}?)(?:이야|야|이에요|예요|입니다)?[.!?~ ]*$/i);
            return match ? match[1] : '';
        }

        function findRememberedName(thread) {
            if (!thread || !Array.isArray(thread.messages)) return '';
            for (let index = thread.messages.length - 1; index >= 0; index -= 1) {
                if (thread.messages[index].role !== 'user') continue;
                const name = extractIntroducedName(thread.messages[index].text);
                if (name) return name;
            }
            return '';
        }

        function inferTopic(text, thread) {
            const topics = [
                { name: 'schedule', words: ['일정', '스케줄', '할 일', '오늘 할', '내일 할', '약속'] },
                { name: 'fee', words: ['모임비', '회비', '납부', '정산', '입금', '안내문'] },
                { name: 'school', words: ['학교', '공지', '수업', '과제', '시험', '준비물'] },
                { name: 'travel', words: ['여행', '숙소', '맛집', '코스', '관광', '항공', '기차표', '제주', '부산', '강릉', '여수', '경주', '도쿄', '오사카', '후쿠오카', '대만', '유럽'] }
            ];
            const direct = topics.find(function (item) { return hasAny(text, item.words); });
            if (direct) return direct.name;
            if (!thread || !Array.isArray(thread.messages) || text.length > 120) return '';

            const previous = thread.messages.slice(0, -1).filter(function (message) {
                return message.role === 'user';
            }).slice(-3).reverse();
            for (let index = 0; index < previous.length; index += 1) {
                const priorText = normalizeForMatch(previous[index].text);
                const matched = topics.find(function (item) { return hasAny(priorText, item.words); });
                if (matched) return matched.name;
            }
            return '';
        }

        function replyAboutSchedule(text, isDirect) {
            const hasTime = /(?:오전|오후)?\s*\d{1,2}(?::\d{2})?\s*(?:시|분)?/.test(text);
            if (hasTime && text.length > 8) {
                return '확인했어요. 말씀해주신 일정은 이렇게 메모할게요.\n\n• ' + cleanForSummary(text) + '\n\n겹치는 일정이나 이동시간도 확인할까요?';
            }
            if (!isDirect && text.length > 3) {
                return '좋아요. 방금 알려주신 내용까지 일정에 반영할게요. 시작 시간이나 마감 시간이 있으면 함께 알려주세요.';
            }
            return '좋아요. 날짜와 시간, 해야 할 일을 한꺼번에 적어주세요. 예: “내일 오후 2시 병원, 6시까지 보고서 제출.” 제가 순서대로 정리해드릴게요.';
        }

        function replyAboutFee(text, isDirect) {
            const amount = text.match(/\d[\d,]*(?:만)?원/);
            if (amount) {
                return '바로 보낼 수 있게 적어봤어요.\n\n[모임비 안내]\n이번 모임비는 ' + amount[0] + '입니다. 확인 후 편하실 때 입금 부탁드려요. 입금하신 분은 알려주시면 확인해둘게요. 감사합니다.';
            }
            if (!isDirect && text.length > 3) {
                return '확인했어요. 안내문에 넣을 금액, 납부 기한, 계좌 정보가 있으면 이어서 보내주세요. 말투는 부드럽게 정리할게요.';
            }
            return '모임비 안내문을 만들어드릴게요. 금액과 납부 기한을 알려주세요. 계좌 정보는 필요할 때만 넣으면 돼요.';
        }

        function replyAboutSchool(text, isDirect) {
            const deadline = text.match(/(?:\d{1,2}월\s*)?\d{1,2}일|(?:오늘|내일|이번\s*주|다음\s*주)\s*(?:까지|전)?/);
            if (deadline && text.length > 10) {
                return '핵심만 메모해둘게요.\n\n• 내용: ' + cleanForSummary(text) + '\n• 확인할 기한: ' + deadline[0] + '\n\n준비물이나 제출 방법이 따로 있으면 이어서 알려주세요.';
            }
            if (!isDirect && text.length > 3) {
                return '좋아요. 방금 내용도 공지 메모에 포함할게요. 마감일과 꼭 해야 하는 행동이 무엇인지 알려주시면 체크리스트로 마무리해드릴게요.';
            }
            return '공지 내용을 그대로 붙여주세요. 날짜, 준비물, 제출할 것처럼 놓치기 쉬운 부분만 뽑아 간단한 체크리스트로 정리해드릴게요.';
        }

        function replyAboutTravel(text, isDirect) {
            const hasUsefulDetail = /\d+\s*(?:명|박|일)|제주|서울|부산|강릉|여수|경주|일본|도쿄|오사카|후쿠오카|대만|유럽/.test(text);
            if (hasUsefulDetail && (!isDirect || text.length > 12)) {
                return '좋아요. 말씀해주신 조건으로 잡아볼게요.\n\n• 기본 조건: ' + cleanForSummary(text) + '\n• 구성 순서: 이동 → 핵심 일정 → 식사 → 여유 시간\n\n출발지와 대략적인 예산까지 알려주시면 더 현실적인 일정으로 다듬을 수 있어요.';
            }
            if (!isDirect && text.length > 3) {
                return '좋아요. 그 조건까지 반영할게요. 출발지와 여행 날짜, 꼭 하고 싶은 것 한 가지만 더 알려주세요.';
            }
            return '어디로, 언제, 몇 명이 가는지 알려주세요. 예산이나 꼭 가고 싶은 장소가 있으면 함께 적어주시면 일정의 기본 틀을 짜드릴게요.';
        }

        function cleanForSummary(text) {
            const clean = String(text).replace(/\s+/g, ' ').trim();
            return clean.length > 90 ? clean.slice(0, 90) + '…' : clean;
        }

        function fallbackReply(text, name) {
            const summary = cleanForSummary(text);
            if (/[?？]$/.test(summary)) {
                return (name ? name + '님, ' : '') + '그 질문은 지금 가진 정보만으로 정확히 답하기 어려워요. 상황을 한두 문장만 더 알려주시면 같이 정리해볼게요.';
            }
            return '“' + summary + '”라고 하신 내용을 들었어요. 제가 정리해드릴까요, 답장을 써드릴까요, 아니면 그냥 이야기를 이어갈까요?';
        }

        function greetingForHour(date) {
            const hour = date.getHours();
            if (hour < 6) return '늦은 시간에도 안녕하세요';
            if (hour < 12) return '좋은 아침이에요';
            if (hour < 18) return '안녕하세요';
            return '좋은 저녁이에요';
        }

        function hasAny(text, words) {
            return words.some(function (word) { return text.indexOf(word) > -1; });
        }

        function createNewThread(shouldFocus) {
            const current = activeThread();
            const hasUserMessage = current.messages.some(function (message) { return message.role === 'user'; });
            if (!hasUserMessage && current.title === '새로운 대화') {
                closeThreadDrawer();
                if (shouldFocus !== false) focusInput();
                return;
            }

            const thread = makeThread();
            store.threads.unshift(thread);
            store.activeId = thread.id;
            saveStore();
            setAssistantThinking(false);
            closeThreadDrawer();
            renderChat();
            renderThreadList();
            inputEl.value = '';
            resizeInput();
            if (shouldFocus !== false) focusInput();
        }

        function switchThread(threadId) {
            if (!store.threads.some(function (thread) { return thread.id === threadId; })) return;
            store.activeId = threadId;
            saveStore();
            setAssistantThinking(pendingReplies.has(threadId));
            inputEl.value = '';
            closeThreadDrawer();
            renderChat();
            renderThreadList();
        }

        function renderThreadList() {
            const sorted = store.threads.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; });
            threadListEl.innerHTML = sorted.map(function (thread) {
                const last = thread.messages[thread.messages.length - 1];
                const preview = last ? last.text.replace(/\s+/g, ' ') : '새로운 대화';
                return '<button type="button" class="thread-item' + (thread.id === store.activeId ? ' active' : '') + '" data-thread-id="' + escapeHtml(thread.id) + '">' +
                    '<span class="thread-avatar" aria-hidden="true"><img src="dhkfodshf.png" alt=""></span>' +
                    '<span class="thread-copy">' +
                        '<span class="thread-name">' + escapeHtml(thread.title) + '</span>' +
                        '<span class="thread-preview">' + escapeHtml(preview) + '</span>' +
                    '</span>' +
                    '<span class="thread-time">' + escapeHtml(formatThreadTime(thread.updatedAt)) + '</span>' +
                '</button>';
            }).join('');
        }

        function formatThreadTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
            }
            return date.toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' });
        }

        function openThreadDrawer() {
            window.haptic();
            closeSourceDrawer();
            renderThreadList();
            drawerEl.classList.add('open');
            drawerEl.setAttribute('aria-hidden', 'false');
        }

        function closeThreadDrawer() {
            drawerEl.classList.remove('open');
            drawerEl.setAttribute('aria-hidden', 'true');
        }

        function openSourceDrawer(messageIndex) {
            const message = activeThread().messages[messageIndex];
            const sources = message ? normalizeSources(message.sources) : [];
            if (!sources.length) return;
            window.haptic();
            closeThreadDrawer();
            sourceSheetCountEl.textContent = '답변에 참고한 웹페이지 ' + sources.length + '개';
            sourceListEl.innerHTML = sources.map(function (source) {
                return '<a class="source-item" href="' + escapeHtml(source.url) + '" target="_blank" rel="noopener noreferrer">' +
                    '<span class="source-icon" aria-hidden="true"><i class="fa-solid fa-globe"></i></span>' +
                    '<span class="source-copy">' +
                        '<span class="source-name">' + escapeHtml(source.title) + '</span>' +
                        '<span class="source-action">웹에서 열기</span>' +
                    '</span>' +
                    '<i class="fa-solid fa-arrow-up-right-from-square source-open-icon" aria-hidden="true"></i>' +
                '</a>';
            }).join('');
            sourceDrawerEl.classList.add('open');
            sourceDrawerEl.setAttribute('aria-hidden', 'false');
        }

        function closeSourceDrawer() {
            sourceDrawerEl.classList.remove('open');
            sourceDrawerEl.setAttribute('aria-hidden', 'true');
        }

        function setAssistantThinking(active) {
            statusDot.classList.toggle('thinking', !!active);
            statusText.textContent = active ? '답변 작성 중…' : '온라인';
            resizeInput();
        }

        function focusInput() {
            try {
                inputEl.focus({ preventScroll: true });
            } catch (error) {
                inputEl.focus();
            }
            lockPageScroll();
        }

        function syncVisualViewport() {
            const viewport = window.visualViewport;
            const height = viewport ? viewport.height : window.innerHeight;
            document.documentElement.style.setProperty('--visual-height', Math.round(height) + 'px');
            document.documentElement.style.setProperty('--visual-top', '0px');
            lockPageScroll();
            if (wasNearBottom) scrollToBottom();
        }

        function lockPageScroll() {
            pageEl.scrollTop = 0;
            const scrollingElement = document.scrollingElement || document.documentElement;
            if (scrollingElement) scrollingElement.scrollTop = 0;
            if (window.scrollY) window.scrollTo(0, 0);
        }

        function handleViewportChange() {
            wasNearBottom = nearBottom();
            document.body.classList.add('keyboard-adjusting');
            window.clearTimeout(viewportSettleTimer);
            requestAnimationFrame(syncVisualViewport);
            viewportSettleTimer = window.setTimeout(function () {
                syncVisualViewport();
                document.body.classList.remove('keyboard-adjusting');
            }, 240);
        }

        formEl.addEventListener('submit', function (event) {
            event.preventDefault();
            submitMessage();
        });
        inputEl.addEventListener('input', resizeInput);
        inputEl.addEventListener('focus', function () {
            wasNearBottom = nearBottom();
            lockPageScroll();
            requestAnimationFrame(syncVisualViewport);
            window.setTimeout(syncVisualViewport, 90);
            window.setTimeout(syncVisualViewport, 280);
        });
        inputEl.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
                event.preventDefault();
                submitMessage();
            }
        });
        messagesEl.addEventListener('scroll', function () {
            wasNearBottom = nearBottom();
        }, { passive: true });
        messagesEl.addEventListener('click', function (event) {
            const sourceButton = event.target.closest('[data-source-index]');
            if (sourceButton) {
                openSourceDrawer(Number(sourceButton.dataset.sourceIndex));
                return;
            }
            const promptButton = event.target.closest('[data-prompt-index]');
            if (!promptButton) return;
            const prompt = quickPrompts[Number(promptButton.dataset.promptIndex)];
            if (prompt) sendQuickPrompt(prompt.text);
        });
        threadListEl.addEventListener('click', function (event) {
            const button = event.target.closest('[data-thread-id]');
            if (button) switchThread(button.dataset.threadId);
        });
        document.getElementById('back-button').addEventListener('click', function () {
            window.haptic();
            returnToEnjoyHome();
        });
        document.getElementById('thread-list-button').addEventListener('click', openThreadDrawer);
        document.getElementById('new-chat-button').addEventListener('click', function () {
            window.haptic();
            createNewThread(true);
        });
        document.getElementById('sheet-new-chat-button').addEventListener('click', function () {
            window.haptic();
            createNewThread(true);
        });
        document.getElementById('thread-backdrop').addEventListener('click', closeThreadDrawer);
        document.getElementById('source-backdrop').addEventListener('click', closeSourceDrawer);
        document.addEventListener('keydown', function (event) {
            if (event.key !== 'Escape') return;
            closeThreadDrawer();
            closeSourceDrawer();
        });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', handleViewportChange, { passive: true });
            window.visualViewport.addEventListener('scroll', handleViewportChange, { passive: true });
        }
        window.addEventListener('resize', handleViewportChange, { passive: true });
        window.addEventListener('orientationchange', handleViewportChange, { passive: true });

        sheetAccountEl.textContent = accountLabel + ' · 로컬 저장';
        saveStore();
        setAssistantThinking(pendingReplies.has(store.activeId));
        syncVisualViewport();
        renderChat();
        renderThreadList();
        resizeInput();
    })();
    </script>
</body>
</html>
