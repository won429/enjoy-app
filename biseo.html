<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f8f9fc">
    <title>베론</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="veron.css?v=20261111-device-1">
    <script src="veron-local.js?v=20261111-device-1" defer></script>
    <script src="veron.js?v=20261111-device-1" defer></script>
</head>
<body>
    <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h11"/></symbol>
            <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 5H6a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-6M15 3l6 6M10 14l1-5 7-7 4 4-7 7-5 1Z"/></symbol>
            <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
            <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 20V4m-7 7 7-7 7 7"/></symbol>
            <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></symbol>
            <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
            <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/></symbol>
            <symbol id="i-file" viewBox="0 0 24 24"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10l-7-7Zm0 0v7h7M8 14h8M8 17h5"/></symbol>
            <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="3"/><path d="M16 8V6a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v7a3 3 0 0 0 3 3h2"/></symbol>
            <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 3M18 18a8 8 0 0 1-13-3"/></symbol>
            <symbol id="i-memory" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-5 2 4 4 0 0 0-1 7 4 4 0 0 0 5 6 3 3 0 0 0 4-2V6a3 3 0 0 0-3-2ZM15 4a3 3 0 0 1 5 2 4 4 0 0 1 1 7 4 4 0 0 1-5 6 3 3 0 0 1-4-2M7 9l5 2m5-2-5 2M8 15h4m4 0h-4"/></symbol>
            <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/></symbol>
            <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
            <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
            <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
            <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
        </defs>
    </svg>
    <div id="enjoy-page" class="veron-page">
        <header class="topbar">
            <button type="button" class="icon-button menu-button" id="thread-list-button" aria-label="대화 기록 열기"><svg><use href="#i-menu"/></svg></button>
            <div class="brand"><span>베론</span><span id="active-thread-title" class="active-title"></span></div>
            <button type="button" class="icon-button" id="new-chat-button" aria-label="새 대화"><svg><use href="#i-new"/></svg></button>
            <button type="button" class="profile-button" id="profile-button" aria-label="프로필 및 메모리 설정"><span id="profile-initial">나</span><img id="profile-image" alt="" hidden></button>
        </header>
        <main id="chat-main" class="chat-main">
            <section id="welcome" class="welcome" aria-label="베론 시작 화면">
                <h1><span id="greeting-name">안녕하세요,</span><span>무엇을 도와드릴까요?</span></h1>
            </section>
            <div id="messages" class="messages" role="log" aria-label="대화 내용" hidden></div>
        </main>
        <button type="button" class="jump-bottom" id="jump-bottom" aria-label="최근 메시지로 이동" hidden><svg><use href="#i-download"/></svg></button>
        <div id="chat-error" class="chat-error" role="alert" hidden><span></span><button type="button" id="retry-button">다시 시도</button></div>
        <form id="chat-form" class="composer-wrap">
            <div class="composer" id="composer">
                <div id="attachment-list" class="attachment-list" aria-label="첨부할 파일" hidden></div>
                <textarea id="chat-input" rows="1" maxlength="12000" placeholder="베론에게 물어보세요" aria-label="메시지 입력"></textarea>
                <div class="composer-toolbar">
                    <div class="attach-anchor">
                        <button id="attach-button" class="icon-button attach-button" type="button" aria-label="사진 또는 파일 첨부" aria-expanded="false" aria-controls="attach-menu"><svg><use href="#i-plus"/></svg></button>
                        <div id="attach-menu" class="attach-menu" hidden>
                            <button type="button" id="pick-photo"><svg><use href="#i-image"/></svg>사진 첨부</button>
                            <button type="button" id="pick-file"><svg><use href="#i-file"/></svg>파일 첨부</button>
                            <p>파일당 6MB · 한 번에 4개</p>
                        </div>
                    </div>
                    <button type="button" class="memory-shortcut" id="memory-shortcut"><svg><use href="#i-memory"/></svg><span>메모리</span></button>
                    <span id="composer-state" class="composer-state" aria-live="polite"></span>
                    <button id="send-button" class="send-button" type="submit" aria-label="보내기" disabled><svg><use href="#i-send"/></svg></button>
                </div>
            </div>
            <input type="file" id="photo-input" accept="image/*" multiple hidden>
            <input type="file" id="file-input" accept="image/*,.pdf,.docx,.xlsx,.pptx,.txt,.md,.csv,.tsv,.json,.xml,.html,.css,.js,.ts,.py,.swift,.java,.sql,.log,.yaml,.yml,.rtf" multiple hidden>
        </form>
    </div>
    <dialog id="thread-drawer" class="history-dialog" aria-labelledby="history-heading">
        <div class="drawer-heading"><div><h2 id="history-heading">대화 기록</h2><p id="sheet-account"></p></div><button type="button" class="icon-button" data-close="thread-drawer" aria-label="대화 기록 닫기"><svg><use href="#i-x"/></svg></button></div>
        <button type="button" id="sheet-new-chat-button" class="new-thread-button"><svg><use href="#i-plus"/></svg>새 대화</button>
        <label class="search-field"><svg><use href="#i-search"/></svg><input id="history-search" type="search" placeholder="대화 검색" aria-label="대화 검색"></label>
        <div id="history-state" class="history-state" role="status"></div>
        <div id="thread-list" class="thread-list"></div>
        <div class="history-footer"><button type="button" id="home-button"><svg><use href="#i-back"/></svg>엔조이로 돌아가기</button><button type="button" id="history-memory-button"><svg><use href="#i-memory"/></svg>메모리</button></div>
    </dialog>
    <dialog id="memory-dialog" class="settings-dialog" aria-labelledby="memory-heading">
        <div class="drawer-heading"><div><h2 id="memory-heading">베론의 메모리</h2><p id="memory-account"></p></div><button type="button" class="icon-button" data-close="memory-dialog" aria-label="메모리 설정 닫기"><svg><use href="#i-x"/></svg></button></div>
        <div class="settings-scroll">
            <div class="memory-toggle-row"><div><strong>대화에 메모리 사용</strong><p>새 대화에서도 저장한 내용을 참고해요.</p></div><label class="switch"><input id="memory-enabled" type="checkbox" checked aria-label="메모리 사용"><span></span></label></div>
            <p class="memory-explainer">대화 중 “기억해줘”라고 말하거나 아래에서 직접 추가하세요. 저장한 내용은 언제든 수정하거나 삭제할 수 있어요.</p>
            <form id="memory-form"><label for="memory-text">기억할 내용</label><textarea id="memory-text" rows="3" maxlength="500" placeholder="예: 답변은 짧고 핵심 위주로 받는 걸 좋아해요."></textarea><div><button type="button" id="memory-cancel" class="text-button" hidden>취소</button><button type="submit" id="memory-save" class="primary-button">추가하기</button></div></form>
            <div id="memory-list" class="memory-list"></div>
            <button type="button" id="memory-clear" class="danger-button" hidden>저장한 메모리 모두 삭제</button>
        </div>
    </dialog>
    <dialog id="rename-dialog" class="small-dialog" aria-labelledby="rename-heading"><form id="rename-form"><h2 id="rename-heading">대화 이름 변경</h2><label class="sr-only" for="rename-input">대화 이름</label><input id="rename-input" maxlength="80" required><div class="dialog-actions"><button type="button" class="text-button" data-close="rename-dialog">취소</button><button type="submit" class="primary-button">저장</button></div></form></dialog>
    <dialog id="confirm-dialog" class="small-dialog" aria-labelledby="confirm-heading"><h2 id="confirm-heading">삭제할까요?</h2><p id="confirm-description"></p><div class="dialog-actions"><button type="button" class="text-button" id="confirm-cancel">취소</button><button type="button" class="primary-button destructive" id="confirm-delete">삭제</button></div></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
